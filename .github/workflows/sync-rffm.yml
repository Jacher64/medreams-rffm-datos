name: Actualizar resultados y clasificación RFFM

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sync-rffm.yml]

permissions:
  contents: write

concurrency:
  group: rffm-data-publication
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Consultar fuentes oficiales y validar la publicación
        run: node --use-env-proxy scripts/sync-federation.mjs
      - name: Publicar datos sin modificar anotaciones del entrenador
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/federation/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Actualizar datos oficiales RFFM'
          git pull --rebase origin main
          git push origin HEAD:main
